services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amtarc
      POSTGRES_PASSWORD: amtarc
      POSTGRES_DB: amtarc
    ports:
      - "5432:5432"
    volumes:
      - amtarc-postgres-data:/var/lib/postgresql/data

volumes:
  amtarc-postgres-data:
