version: 2
updates:
  # Single entry covers the whole pnpm workspace (one lockfile at the root).
  # PRs target develop so main only moves through reviewed develop merges.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    # Daily, not weekly: a grouped PR that sits for days gets overtaken by
    # develop and conflicts on the lockfile, and Dependabot cannot rebase out
    # of that state (its up-to-date check ignores the lockfile). See PR #27.
    schedule:
      interval: daily
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
